    <style>
/* =========================================================
   構築メモ UI（ダメ計と同じフォーマット）
   ========================================================= */
:root {
    --atk: #e8604c; --atk-bg: #fde3df;
    --def: #3d8bd9; --def-bg: #dcebfa;
    --env: #5f9a35; --env-bg: #e3efd7;
    --memo: #7a5af5; --memo-bg: #ece7ff;
    --ink: #222; --muted: #6b6b6b; --line: #d9d9d9;
    --bg: #eef0f3; --card: #fff; --chip: #6e6e6e;
    --header-h: 52px; --tabs-h: 58px; --radius: 12px;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.45;
    padding-top: var(--header-h);
    padding-bottom: calc(var(--tabs-h) + 16px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
input[type="number"], input[type="text"], select, textarea {
    width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    font-size: 16px !important;
}
input[type="number"], input[type="text"], select { height: 42px; }
select { min-width: 0; max-width: 100%; }
input[type="number"] { text-align: center; -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(61,139,217,.35); border-color: var(--def); }
h2, h3, h4 { margin: 0; }

/* ---------- ヘッダー ---------- */
.app-header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 9000;
    display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 6px;
    padding: 0 10px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
}
.app-header h1 { margin: 0; text-align: center; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-link { border: none; background: none; color: #1f7ae0; font-size: 16px; font-weight: 600; padding: 8px 4px; white-space: nowrap; }
.hamburger-menu { position: relative; z-index: 11000; }
.hamburger-btn { width: 40px; height: 40px; border-radius: 8px; background: #f2f4f7; border: none; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; }
.hamburger-btn span { width: 20px; height: 2px; background: #333; display: block; border-radius: 2px; transition: .25s; }
.hamburger-btn.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger-btn.active span:nth-child(2) { opacity: 0; }
.hamburger-btn.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.nav-menu { position: fixed; top: var(--header-h); left: -270px; width: 260px; height: calc(100% - var(--header-h)); background: #fff; box-shadow: 2px 0 12px rgba(0,0,0,.15); display: flex; flex-direction: column; transition: left .25s; z-index: 11000; padding-top: 8px; }
.nav-menu.open { left: 0; }
.nav-link { display: block; padding: 16px 22px; color: #333; text-decoration: none; font-weight: 700; border-bottom: 1px solid #eee; }
.nav-link:hover { background: #f0f7ff; color: #1f7ae0; }

/* ---------- ページ / ツールバー ---------- */

.toolbar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.tool-btn { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; color: #333; white-space: nowrap; }
.tool-btn.primary { background: #1f7ae0; color: #fff; border-color: #1f7ae0; }

/* ---------- パネル ---------- */
.panel { border-radius: var(--radius); overflow: hidden; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 14px; color: #fff; font-weight: 800; font-size: 17px; }
.panel-head .head-btn { border: none; background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; }

.panel-memo { background: var(--memo-bg); } .panel-memo .panel-head { background: var(--memo); }
.pokemon-card { background: var(--def-bg); scroll-margin-top: calc(var(--header-h) + 8px); }
.pokemon-card .panel-head { background: var(--def); }
.pokemon-card .head-btn { color: var(--def); }
.pokemon-card .head-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pokemon-card .head-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-title { font-size: 12px; font-weight: 800; color: #2c6aa8; letter-spacing: .08em; margin-top: 2px; padding-left: 2px; display: flex; justify-content: space-between; align-items: center; }

/* 行 */
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 8px; }

.poke-icon { width: 48px; height: 48px; object-fit: cover; object-position: 0 50%; }
.head-icon { width: 32px; height: 32px; object-fit: cover; object-position: 0 50%; background: rgba(255,255,255,.85); border-radius: 8px; }
.item-icon { width: 28px; height: 28px; object-fit: contain; }

/* 種族値・タイプ */
.meta-line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.type-badge { padding: 2px 9px; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 800; }
.champ-badge { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 800; background: #fff; border: 1.5px solid #f0a020; color: #b86e00; }

/* 検索 */
.search-container { position: relative; min-width: 0; }

.suggestion-list[style*="block"] { display: grid !important; }
.suggestion-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 15px; }

.mega-toggle-btn { margin-top: 6px; width: auto !important; padding: 5px 12px !important; border-radius: 999px !important; border: none; background: #6c757d; color: #fff; font-size: 12px !important; font-weight: 700; }

/* 能力値テーブル */
.stat-table { width: 100%; border-collapse: separate; border-spacing: 0 4px; }
.stat-table th { font-size: 11px; color: var(--muted); font-weight: 800; padding: 0 2px; text-align: center; }

.stat-table td:first-child { border-radius: 8px 0 0 8px; font-size: 13px; color: #555; width: 44px; }
.stat-table td:last-child { border-radius: 0 8px 8px 0; }
.stat-table .base-val { color: #fff; }
.stat-table td.base-cell { width: 50px; }
.stat-table td.base-cell .base-val { display: inline-block; min-width: 38px; padding: 1px 6px; border-radius: 6px; background: var(--chip); font-size: 14px; }
.ev-cell { display: flex; align-items: center; justify-content: center; gap: 3px; }
.ev-cell button { width: 40px; height: 34px; flex: 0 0 40px; border-radius: 8px; border: 1.5px solid var(--def); background: #fff; font-size: 15px; line-height: 1; color: var(--def); padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }

/* 技 */
.moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.memo-area { width: 100%; height: 72px; padding: 8px; resize: vertical; background: #fffdf0; }

/* 技のタイプ色（ダメ計と同じ配色） */

.type-water { background-color: #2980ef !important; color: #fff; }

/* チップ */

.chip:has(input:checked) { background: #f0a020; color: #fff; border-color: #f0a020; }
.chip:has(input:checked)::before { border-color: #fff; box-shadow: inset 0 0 0 3px #f0a020; }

.lm-item:active, .lm-item:hover { background: #f2f6fb; }

/* ---------- パーティ欄の読込・保存（見出しの右） ---------- */

.np-backdrop.open { display: flex; }

<script type="module">

  // ハッシュ化関数
  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ★JSONからハッシュ値を取得する関数
  async function getMasterHash() {
    try {
      const response = await fetch('abdata.json'); // パスは適宜調整してください
      const data = await response.json();
      return data.master_hash;
    } catch (error) {
      console.error("JSONの読み込みに失敗しました:", error);
      return null;
    }
  }

// 修正後
function importPartyFromCode(code) {
    try {
        const decoded = code.replace(/-/g, '+').replace(/_/g, '/');
        const str = atob(decoded);
        
        // Safariでも安定して動作する Uint8Array の生成方法に変更
        const len = str.length;
        const charData = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            charData[i] = str.charCodeAt(i);
        }

        // pakoの解凍（文字列への変換を安全に行う）
        const decompressed = pako.inflate(charData, { to: 'string' });
        const data = JSON.parse(decompressed);

        // --- 以下、反映処理 ---
        document.getElementById('partyName').value = data.n || "";
        document.getElementById('partyMemo').value = data.m || "";
        data.p.forEach((m, i) => {
            const card = document.getElementById(`pokemon-${i}`);
            if (!card) return;
            const spInp = card.querySelector('.sp-input');
            spInp.value = m.nm || "";
            spInp.dataset.selectedId = m.id || "";
            
            const speciesObj = db.species.find(s => s.id === m.id);
if (speciesObj) {
    updateSpecies(i, speciesObj.data);
}
// 持ち物IDの自動復元を追加
const itemInput = card.querySelector('.item-input');
itemInput.value = m.it || "";
const foundItem = db.items.find(it => it.name === m.it);
if (foundItem) itemInput.dataset.selectedId = foundItem.id;

            //card.querySelector('.item-input').value = m.it || "";
            card.querySelector('.ability-select').value = m.ab || "";
            card.querySelector('.nature-select').value = m.nt || "まじめ";
            card.querySelectorAll('.ev-input').forEach((el, j) => {
                el.value = (m.ev && m.ev[j] !== undefined) ? m.ev[j] : 0;
                validateEV(el, i);
            });
            card.querySelectorAll('.move-input').forEach((el, j) => {
                el.value = (m.mv && m.mv[j]) ? m.mv[j] : "";
                const found = db.moves.find(mv => mv.name === el.value);
                updateMoveColor(el, found ? found.type : "");
            });
            card.querySelector('.memo-area').value = m.mo || "";
        });
        console.log("URLからの読み込みに成功しました");
    } catch (e) {
        console.error("URLコード解析エラー:", e);
    }
}
// CanvasContextにroundRectがない場合のポリフィル
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'undefined') r = 0;
        if (typeof r === 'number') r = [r, r, r, r];
        const tl = r[0] || 0;
        const tr = r[1] || 0;
        const br = r[2] || 0;
        const bl = r[3] || 0;

        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
    };
}
async function exportPartyImage() {
    // 1. 生成を開始した瞬間の最新UI情報を取得
    const partyName = document.getElementById('partyName').value || "無題のパーティ";
    const fullMemo = document.getElementById('partyMemo').value || "";
    const cards = document.querySelectorAll('.pokemon-card');

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    const baseWidth = 1250;
    const baseHeight = 900;
    let extraHeight = 0;

    // --- メモの高さ計算 ---
    const memoFontSize = 20;
    const memoLineHeight = 28;
    const memoPadding = 40;
    const memoMaxWidth = baseWidth - (memoPadding * 2);
    let memoLines = [];

    if (fullMemo) {
        ctx.font = `${memoFontSize}px sans-serif`;
        const rawLines = fullMemo.split('\n');
        rawLines.forEach(line => {
            let currentLine = "";
            for (let char of line) {
                let testLine = currentLine + char;
                if (ctx.measureText(testLine).width > memoMaxWidth) {
                    memoLines.push(currentLine);
                    currentLine = char;
                } else { currentLine = testLine; }
            }
            memoLines.push(currentLine);
        });
        extraHeight = (memoLines.length * memoLineHeight) + 100; 
    }

    canvas.width = baseWidth;
    canvas.height = baseHeight + extraHeight;
    
    // 背景初期化
    ctx.fillStyle = "#f8f9fa";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // タイトル
    ctx.fillStyle = "#333";
    ctx.font = "bold 32px sans-serif";
    ctx.fillText(`構築メモ: ${partyName}`, 40, 60);

    const typeColors = {
        normal: '#A8A878', fire: '#F08030', water: '#6890F0', electric: '#F8D030',
        grass: '#78C850', ice: '#98D8D8', fighting: '#C03028', poison: '#A040A0',
        ground: '#E0C068', flying: '#A890F0', psychic: '#F85888', bug: '#A8B820',
        rock: '#B8A038', ghost: '#705898', dragon: '#7038F8', dark: '#705848',
        steel: '#B8B8D0', fairy: '#EE99AC'
    };

    const drawTasks = [];

    for (let i = 0; i < 6; i++) {
        const card = cards[i];
        if (!card) continue;

        const x = (i % 3) * 400 + 40;
        const y = Math.floor(i / 3) * 380 + 100;

        // UIデータのスナップショット取得
        const pokemonName = card.querySelector('.sp-input').value || "???";
        const spId = card.querySelector('.sp-input').dataset.selectedId;
        const itemInput = card.querySelector('.item-input');
        const itemName = itemInput.value || "なし";
        const itemId = itemInput.dataset.selectedId;
        const abValue = card.querySelector('.ability-select').value;
        const abilityName = db.abilities[abValue]?.name || abValue || "---";
        const natureName = card.querySelector('.nature-select').value;
        const nature = NATURES[natureName] || {up:0, down:0};
        const statsTotals = Array.from(card.querySelectorAll('.total-display')).map(el => el.textContent);
        const statsEVs = Array.from(card.querySelectorAll('.ev-input')).map(el => el.value);
        const movesData = Array.from(card.querySelectorAll('.move-input')).map(input => {
            const found = db.moves.find(m => m.name === input.value);
            return { name: input.value, type: found ? found.type : "" };
        });
        const personalMemo = card.querySelector('.memo-area').value || "";

        const task = (async () => {
            // 外枠
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.roundRect(x, y, 380, 360, 10);
            ctx.fill();
            ctx.strokeStyle = "#ddd";
            ctx.stroke();

            // 基本テキスト描画
            ctx.fillStyle = "#000";
            ctx.font = "bold 22px sans-serif";
            ctx.fillText(pokemonName, x + 110, y + 40);
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#555";
            ctx.fillText(`特性: ${abilityName}`, x + 110, y + 65);
            ctx.fillText(`もちもの: ${itemName}`, x + 110, y + 90);

            // ステータス・技・個別メモの描画（省略せず一括実行）
            drawStatsAndMoves(ctx, x, y, labels = ['H','A','B','C','D','S'], nature, statsTotals, statsEVs, movesData, typeColors, personalMemo);

            // --- アイコン描画（サイズ指定 64px / 32px） ---
            const loadImage = (src) => new Promise(res => {
                const img = new Image();
                // 同一ドメインからの読み込みでSafariのCORSエラーを防ぐ
                if (!src.startsWith('data:')) {
                    img.crossOrigin = "anonymous";
                }
                img.onload = () => res(img);
                img.onerror = (e) => {
                    console.warn("画像の読み込みに失敗:", src);
                    res(null); // エラーが起きても止めずに続行
                };
                img.src = `${src}?t=${new Date().getTime()}`;
            });

            const pokemonIconSize = 64;
            const itemIconSize = 32;
            const px = x + 10;
            const py = y + 10;

            if (spId) {
                const icon = await loadImage(`Icons/${spId.charAt(0).toUpperCase()}/${spId.toUpperCase()}.png`);
                if (icon) {
                    ctx.drawImage(icon, 0, 0, 64, 64, px, py, pokemonIconSize, pokemonIconSize);
                }
            }

            if (itemId && itemId !== "none") {
                const itemIcon = await loadImage(`Items/${itemId}.png`);
                if (itemIcon) {
                    // 元のコードの重なり計算: 右下に少しはみ出すオフセット
                    const overlapOffset = 8;
                    const ix = px + pokemonIconSize - itemIconSize + overlapOffset;
                    const iy = py + pokemonIconSize - itemIconSize + overlapOffset;
                    ctx.drawImage(itemIcon, ix, iy, itemIconSize, itemIconSize);
                }
            }
        })();
        drawTasks.push(task);
    }

    await Promise.all(drawTasks);

    // パーティ全体メモ描画
    if (memoLines.length > 0) {
        renderFullMemo(ctx, baseHeight, baseWidth, memoPadding, memoLines, memoFontSize, memoLineHeight);
    }

    // ★【修正ポイント1】非同期処理に入る前に、同期的に空のウィンドウを即座に開いておく
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    let newWindow = null;

    if (isSafari || isIOS) {
        // クリック直後なので絶対にブロックされない！
        newWindow = window.open('about:blank', '_blank');
        if (newWindow) {
            newWindow.document.write('<p style="font-family:sans-serif; text-align:center; padding-top:50px;">画像を生成中...</p>');
        }
    }

    // 画像の読み込みなどを待つ
    await Promise.all(drawTasks);

    // パーティ全体メモ描画
    if (memoLines.length > 0) {
        renderFullMemo(ctx, baseHeight, baseWidth, memoPadding, memoLines, memoFontSize, memoLineHeight);
    }

    const dataUrl = canvas.toDataURL('image/png');

    // ★【修正ポイント2】あらかじめ開いておいたタブの中身を画像に差し替える
    if (isSafari || isIOS) {
        if (newWindow) {
            newWindow.document.open();
            newWindow.document.write(`
                <html>
                    <head><title>構築画像</title></head>
                    <body style="margin:0; text-align:center; background:#f8f9fa; padding:20px;">
                        <p style="font-size:16px; font-weight:bold; color:#333; margin-bottom:15px;">
                            画像を長押し（または右クリック）して保存してください
                        </p>
                        <img src="${dataUrl}" style="max-width:100%; height:auto; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.15);" />
                    </body>
                </html>
            `);
            newWindow.document.close();
        } else {
            alert("ポップアップがブロックされました。ブラウザの設定でポップアップを許可してください。");
        }
    } else {
        // PCやAndroid Chrome等の場合はそのままダウンロード
        const link = document.createElement('a');
        link.download = `${partyName}_${new Date().getTime()}.png`;
        link.href = dataUrl;
        link.click();
    }
}

// 描画補助関数（コードをスッキリさせるため）
function drawStatsAndMoves(ctx, x, y, labels, nature, statsTotals, statsEVs, movesData, typeColors, personalMemo) {
    labels.forEach((label, j) => {
        const rowY = y + 105 + (j * 26);
        ctx.fillStyle = "#666";
        ctx.font = "14px monospace";
        ctx.fillText(label, x + 20, rowY);
        let statColor = "#000";
        if (j !== 0) {
            if (nature.up === j) statColor = "#d9534f";
            if (nature.down === j) statColor = "#0275d8";
        }
        ctx.fillStyle = statColor;
        ctx.font = "bold 17px monospace";
        ctx.fillText(statsTotals[j].padStart(3, ' '), x + 45, rowY);
        if (parseInt(statsEVs[j]) > 0) {
            ctx.fillStyle = "#28a745";
            ctx.font = "11px sans-serif";
            ctx.fillText(`(+${statsEVs[j]})`, x + 85, rowY);
        }
    });

    movesData.forEach((mv, j) => {
        const mY = y + 105 + (j * 38);
        const mX = x + 165;
        ctx.fillStyle = mv.type ? typeColors[mv.type.toLowerCase()] : "#eee";
        ctx.beginPath();
        ctx.roundRect(mX, mY, 195, 32, 4);
        ctx.fill();
        ctx.fillStyle = mv.type ? "#fff" : "#333";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(mv.name || "-", mX + 10, mY + 21);
    });

    if (personalMemo) {
        ctx.fillStyle = "#444";
        ctx.font = "12px sans-serif";
        personalMemo.split('\n').slice(0, 4).forEach((line, idx) => {
            ctx.fillText(line, x + 20, y + 285 + (idx * 16));
        });
    }
}

function renderFullMemo(ctx, baseHeight, baseWidth, memoPadding, memoLines, memoFontSize, memoLineHeight) {
    const memoStartY = baseHeight;
    ctx.fillStyle = "#6f42c1";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("備考欄・選出パターン等", memoPadding, memoStartY);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.roundRect(memoPadding, memoStartY + 20, baseWidth - (memoPadding * 2), (memoLines.length * memoLineHeight) + 20, 8);
    ctx.fill();
    ctx.strokeStyle = "#6f42c1";
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.font = `${memoFontSize}px sans-serif`;
    memoLines.forEach((line, idx) => {
        ctx.fillText(line, memoPadding + 15, memoStartY + 55 + (idx * memoLineHeight));
    });
}

function setupSaveSlots() {
    const s = document.getElementById('saveSlot');
    s.innerHTML = ''; // 初期化
    for (let i = 1; i <= 50; i++) {
        const o = document.createElement('option');
        o.value = i;
        
        // localStorageから該当スロットのデータをチェック
        const storageKey = `p_slot_66_v3_${i}`;
        const raw = localStorage.getItem(storageKey);
        let displayName = `スロット ${i}`;
        
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.name) {
                    displayName = `${i}: ${data.name}`;
                }
            } catch (e) {
                console.error(`Error parsing slot ${i}`, e);
            }
        }
        
        o.textContent = displayName;
        s.appendChild(o);
    }
}

function toKatakana(str) {
    return str.replace(/[ぁ-ん]/g, s => String.fromCharCode(s.charCodeAt(0) + 0x60));
}

function updateMoveColor(input, type) {
    // 全てのタイプクラスを一度削除
    input.className = 'search-input move-input';
    if (type) {
        input.classList.add(`type-${type.toLowerCase()}`);
    }
}

function setupSearchableInput(container, dataList, onSelectCallback) {
    const input = container.querySelector('.search-input');
    const list = container.querySelector('.suggestion-list');

    input.addEventListener('input', () => {
        const query = toKatakana(input.value.toLowerCase());
        list.innerHTML = '';
        if (!query) { 
            list.style.display = 'none'; 
            if(input.classList.contains('move-input')) updateMoveColor(input, "");
            return; 
        }
        const src = (typeof dataList === 'function') ? dataList() : dataList;
        const filtered = src.filter(item => toKatakana(item.name).includes(query)).slice(0, 30);
        if (filtered.length > 0) {
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.name;
                div.onclick = () => {
                    input.value = item.name;
                    input.dataset.selectedId = item.id;
                    list.style.display = 'none';
                    if (onSelectCallback) onSelectCallback(item);
                    if (input.classList.contains('move-input')) updateMoveColor(input, item.type);
                };
                list.appendChild(div);
            });
            list.style.display = 'block';
        } else { list.style.display = 'none'; }
    });
    input.addEventListener('blur', () => {
        setTimeout(() => {
            list.style.display = 'none';
            // 手動入力時も色を反映させる
            if (input.classList.contains('move-input')) {
                const found = db.moves.find(m => m.name === input.value);
                updateMoveColor(input, found ? found.type : "");
            }
        }, 200);
    });
}

function openNewWindow(url) {
    // 画面幅が600px未満（スマホ想定）ならサイズ指定をしない
    const isMobile = window.innerWidth < 600;

    if (isMobile) {
        // スマホは単純に新規タブで開く（ブラウザが全画面で綺麗に処理してくれます）
        window.open(url, '_blank');
    } else {
        // PCは中央ポップアップ
        const width = 800;
        const height = 1000;
        const left = (screen.width - width) / 2;
        const top = (screen.height - height) / 2;

        window.open(
            url, 
            '_blank', 
            `width=${width},height=${height},left=${left},top=${top},scrollbars=yes,resizable=yes`
        );
    }
}

function updateSpecies(idx, speciesData) {
    const card = document.getElementById(`pokemon-${idx}`);
    if (!card || !speciesData) return;

    const name = speciesData.Name;
    const itemInput = card.querySelector('.item-input');
    
    // 1. 専用アイテムの自動設定
    if (typeof MEGA_STONE_MAP !== 'undefined' && MEGA_STONE_MAP[name]) {
        const stoneName = MEGA_STONE_MAP[name];
        itemInput.value = stoneName;
        const itemObj = db.items.find(i => i.name === stoneName);
        if (itemObj) itemInput.dataset.selectedId = itemObj.id;
    }

    // 2. 例外マッピング定義
    // ※ db.species内の正確な名前に書き換えてください（例: カッコが全角か半角かなど）
    const MEGA_EXCEPTIONS = {
        "メガフラエッテ": "フラエッテ(えいえん)",
        "メガニャオニクス": "ニャオニクス(オス)",
        "メガジガルデ": "ジガルデ(パーフェクト)"
    };

    // 3. メガシンカ判定
    const isMega = (name.startsWith("メガ") && !["メガヤンマ", "メガニウム"].includes(name)) || 
                   !!MEGA_EXCEPTIONS[name];
    
    const container = card.querySelector('.sp-input').parentNode;
    const oldBtn = container.querySelector('.mega-toggle-btn');
    if (oldBtn) oldBtn.remove();

    if (isMega) {
        const btn = document.createElement('button');
        btn.className = 'mega-toggle-btn';
        btn.textContent = "メガシンカ前";
        btn.dataset.mode = "mega";
        btn.style.cssText = "width:100%; padding:4px; font-size:11px; margin-top:5px; background:#6c757d; color:white; border:none; border-radius:4px; cursor:pointer;";
        
        btn.onclick = (e) => {
            e.preventDefault();
            const isShowingMega = btn.dataset.mode === "mega";
            
            if (isShowingMega) {
                // 例外テーブルにあるか確認、なければ正規表現で置換
                const baseName = MEGA_EXCEPTIONS[name] || name.replace("メガ", "").replace(/X$|Y$|Z$/, "");
                
                // デバッグ用：名前が一致しているかコンソールで確認できるようにします
                console.log("Searching for base species:", baseName);

                const baseSpecies = db.species.find(s => s.name === baseName);
                
                if (baseSpecies) {
                    applyStats(idx, baseSpecies.data);
                    btn.dataset.mode = "normal";
                    btn.textContent = "メガシンカ後へ";
                } else {
                    console.error("Base species not found in db.species:", baseName);
                    // 見つからない場合、カッコの種類を変えて再試行するなどの処理が必要かもしれません
                }
            } else {
                applyStats(idx, speciesData);
                btn.dataset.mode = "mega";
                btn.textContent = "メガシンカ前へ";
            }
        };
        container.appendChild(btn);
    }

    applyStats(idx, speciesData);
}

function applyStats(idx, data) {
    const card = document.getElementById(`pokemon-${idx}`);
    const bases = [data.HP, data.Atk, data.Def, data.SpAtk, data.SpDef, data.Speed];
    
    card.querySelectorAll('.base-val').forEach((td, i) => {
        td.textContent = bases[i] || 0;
    });
    
    const abSelect = card.querySelector('.ability-select');
    const abs = [...(data.Abilities || []), ...(data.HiddenAbilities || [])];
    abSelect.innerHTML = abs.map(a => `<option value="${a}">${db.abilities[a]?.name || a}</option>`).join('');
    
    calcStats(idx);
}

function validateEV(input, idx) {
    let val = parseInt(input.value);
    if (val > MAX_SINGLE_EV) input.value = MAX_SINGLE_EV;
    if (val < 0 || isNaN(val)) val = 0;
    const card = document.getElementById(`pokemon-${idx}`);
    const evs = [...card.querySelectorAll('.ev-input')];
    let sum = evs.reduce((acc, cur) => acc + (parseInt(cur.value) || 0), 0);
    const sumDisplay = card.querySelector('.ev-sum');
    sumDisplay.textContent = sum;
    sumDisplay.classList.toggle('ev-over', sum > MAX_TOTAL_EV);
    calcStats(idx);
}

function calcStats(idx) {
    const card = document.getElementById(`pokemon-${idx}`);
    const nature = NATURES[card.querySelector('.nature-select').value] || NATURES["まじめ"];
    const rows = card.querySelectorAll('.stats-row');

    rows.forEach((row, i) => {
        const base = parseInt(row.querySelector('.base-val').textContent) || 0;
        const iv = 31;
        const ev = parseInt(row.querySelector('.ev-input').value) || 0;
        let val = 0;
        if (i === 0) {
            val = (base === 1) ? 1 : Math.floor((base * 2 + iv) * 50 / 100) + 60 + ev;
        } else {
            let core = Math.floor((base * 2 + iv) * 50 / 100) + 5;
            val = Math.floor(core + ev); 
            if (nature.up === i) val = Math.floor(val * 1.1);
            if (nature.down === i) val = Math.floor(val * 0.9);
        }
        const display = row.querySelector('.total-display');
        display.textContent = val;
        display.className = 'total-display';
        if (i !== 0) {
            if (nature.up === i) display.classList.add('nature-up');
            if (nature.down === i) display.classList.add('nature-down');
        }
    });
}

function exportPartyCode() {
    const partyData = {
        n: document.getElementById('partyName').value,
        m: document.getElementById('partyMemo').value,
        p: []
    };

    for (let i = 0; i < 6; i++) {
        const card = document.getElementById(`pokemon-${i}`);
        const spInp = card.querySelector('.sp-input');
        partyData.p.push({
            id: spInp.dataset.selectedId || "",
            nm: spInp.value || "",
            it: card.querySelector('.item-input').value || "",
            ab: card.querySelector('.ability-select').value || "",
            nt: card.querySelector('.nature-select').value || "まじめ",
            ev: Array.from(card.querySelectorAll('.ev-input')).map(el => parseInt(el.value || 0)),
            mv: Array.from(card.querySelectorAll('.move-input')).map(el => el.value || ""),
            mo: card.querySelector('.memo-area').value || ""
        });
    }

    const jsonStr = JSON.stringify(partyData);
    const compressed = pako.deflate(jsonStr);
    
    // Safariでのスタック溢れを防止するためのループ処理によるBase64変換
    let binary = '';
    const len = compressed.byteLength;
    for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(compressed[i]);
    }
    const base64 = btoa(binary)
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

    const shareUrl = window.location.origin + window.location.pathname + "?party=" + base64;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
            alert("共有用URLをコピーしました！\n(文字数: " + shareUrl.length + ")");
        }).catch(() => {
            prompt("以下のURLをコピーしてください:", shareUrl);
        });
    } else {
        prompt("以下のURLをコピーしてください:", shareUrl);
    }
}

    const partyMemo = document.getElementById('partyMemo').value;
    const storageKey = `p_slot_66_v3_${slot}`;

function deleteParty() {

function loadParty() {
    const slot = document.getElementById('saveSlot').value;
    const raw = localStorage.getItem(`p_slot_66_v3_${slot}`);
    if (!raw) return alert("データがありません");
    const data = JSON.parse(raw);
    document.getElementById('partyName').value = data.name;
    document.getElementById('partyMemo').value = data.partyMemo || "";
    data.members.forEach((m, i) => {
        const c = document.getElementById(`pokemon-${i}`);
        const spInp = c.querySelector('.sp-input');
        spInp.value = m.spName;
        spInp.dataset.selectedId = m.spId;
        const speciesObj = db.species.find(s => s.id === m.spId);
        if (speciesObj) updateSpecies(i, speciesObj.data);
        c.querySelector('.item-input').value = m.itName || "";
        c.querySelector('.item-input').dataset.selectedId = m.itId || "";
        c.querySelector('.nature-select').value = m.nt;
        c.querySelectorAll('.ev-input').forEach((el, j) => { el.value = m.ev[j]; validateEV(el, i); });
        c.querySelector('.ability-select').value = m.ab;
        c.querySelectorAll('.move-input').forEach((el, j) => {
            el.value = m.mv[j].name;
            el.dataset.selectedId = m.mv[j].id;
            const foundMove = db.moves.find(mv => mv.name === el.value);
            updateMoveColor(el, foundMove ? foundMove.type : "");
        });
        c.querySelector('.memo-area').value = m.memo || "";
    });
}

<script>

const MEMO_TYPES = ['NORMAL','FIRE','WATER','ELECTRIC','GRASS','ICE','FIGHTING','POISON','GROUND','FLYING','PSYCHIC','BUG','ROCK','GHOST','DRAGON','DARK','STEEL','FAIRY'];

const MEMO_TYPE_COLOR = {NORMAL:'#9fa19f',FIRE:'#e62829',WATER:'#2980ef',ELECTRIC:'#d4b400',GRASS:'#3fa129',ICE:'#3dc7ef',FIGHTING:'#ff8000',POISON:'#9141cb',GROUND:'#915121',FLYING:'#81b9ef',PSYCHIC:'#ef4179',BUG:'#91a119',ROCK:'#afa981',GHOST:'#704170',DRAGON:'#5060e1',DARK:'#624d4e',STEEL:'#60a1b8',FAIRY:'#ef70ef'};
const STAT_JA = ['H','A','B','C','D','S'];

function natureLabel(n) {

/* ---------- カードのポケモン特定 ---------- */
function cardKey(i) {
    const inp = document.querySelector(`#pokemon-${i} .sp-input`);
    if (!inp) return null;
    const v = inp.value.trim();
    if (!v) return null;
    const sel = inp.dataset.selectedId;
    const bySel = sel && db.species.find(s => s.id === sel);
    if (bySel && bySel.name === v) return sel;
    const byName = db.species.find(s => s.name === v || s.name === toKatakana(v));
    return byName ? byName.id : (sel || null);
}
function isChampLegal(key) { return !!(CHAMP && key && CHAMP.sets[key]); }

/* ---------- 候補の絞り込み ---------- */
function speciesCandidates() {
    if (CHAMP && document.getElementById('champOnly')?.checked) {
        return db.species.filter(s => CHAMP.sets[s.id]);
    }
    return db.species;
}
function moveCandidates(i) {
    const key = cardKey(i);
    if (document.getElementById('learnOnly')?.checked && isChampLegal(key)) {

}

/* ---------- 性格（表から選択） ---------- */
const NP_STATS = ['攻撃', '防御', '特攻', '特防', '素早'];            // NATURES の up/down 1〜5 に対応
let npIdx = 0;
// 対角（無補正）は右下の「まじめ」だけ。他の対角マスは空欄
function natureAt(up, down) {
    if (up === down) return up === 5 ? 'まじめ' : null;
    return Object.keys(NATURES).find(n => NATURES[n].up === up && NATURES[n].down === down);
}
function syncNatureButton(i) {
    const card = document.getElementById(`pokemon-${i}`);
    const btn = card && card.querySelector('.nature-open-btn');
    if (!btn) return;
    const n = card.querySelector('.nature-select').value || 'まじめ';
    const d = NATURES[n];
    btn.innerHTML = (d && d.up)
        ? `<span>${n}<span class="eff"><span class="up">${STAT_JA[d.up]}↑</span> <span class="down">${STAT_JA[d.down]}↓</span></span></span>`
        : `<span>${n}<span class="eff" style="color:var(--muted)">無補正</span></span>`;
}
function openNaturePicker(i) {

    const cur = document.querySelector(`#pokemon-${i} .nature-select`).value || 'まじめ';
    const name = document.querySelector(`#pokemon-${i} .sp-input`).value.trim();

    let html = '<div class="hd"></div>' + NP_STATS.map(s => `<div class="hd">${s}<span class="d">↓</span></div>`).join('');
    for (let up = 1; up <= 5; up++) {
        html += `<div class="hd">${NP_STATS[up - 1]}<span class="u">↑</span></div>`;
        for (let down = 1; down <= 5; down++) {
            const n = natureAt(up, down);
            if (!n) { html += '<div class="np-blank"></div>'; continue; }
            html += `<button type="button" class="${up === down ? 'neutral' : ''} ${n === cur ? 'active' : ''}" data-nature="${n}">${n}</button>`;
        }
    }
    document.getElementById('np-grid').innerHTML = html;
    document.getElementById('naturePicker').classList.add('open');
}
function closeNaturePicker() { document.getElementById('naturePicker').classList.remove('open'); }
document.getElementById('np-grid').addEventListener('click', e => {

/* ---------- 努力値 ± / カードクリア ---------- */
function stepEV(i, j, d) {
    const input = document.querySelectorAll(`#pokemon-${i} .ev-input`)[j];
    if (!input) return;
    input.value = Math.max(0, Math.min(MAX_SINGLE_EV, (parseInt(input.value) || 0) + d));
    validateEV(input, i);
}
// ▲▼ 長押しで連続増減（ダメ計と同じ：0.45秒後から0.08秒ごと）
(function setupEVRepeat() {
    let t1 = null, t2 = null;
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    document.getElementById('partyGrid').addEventListener('pointerdown', e => {
        const b = e.target.closest('.ev-step');
        if (!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
        e.preventDefault();
        stop();
        const i = +b.dataset.card, j = +b.dataset.stat, d = +b.dataset.delta;
        stepEV(i, j, d);
        t1 = setTimeout(() => { t2 = setInterval(() => stepEV(i, j, d), 80); }, 450);
        try { b.setPointerCapture(e.pointerId); } catch (_) {}
    });
    ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(ev =>
        document.getElementById('partyGrid').addEventListener(ev, e => { if (e.target.closest && e.target.closest('.ev-step')) stop(); }, true));
    window.addEventListener('blur', stop);
    document.getElementById('partyGrid').addEventListener('contextmenu', e => { if (e.target.closest('.ev-step')) e.preventDefault(); });
})();

/* ---------- 覚える技 一覧 ---------- */
const LM = { idx: 0, cat: '', sort: 'type', type: '', slot: 0 };
function lmMoveInputs() { return [...document.querySelectorAll(`#pokemon-${LM.idx} .move-input`)]; }
function openLearnset(i) {
    const key = cardKey(i);
    if (!isChampLegal(key)) { alert('このポケモンはチャンピオンズの技データがありません。'); return; }
    LM.idx = i;
    const inputs = lmMoveInputs();
    const empty = inputs.findIndex(el => !el.value.trim());
    LM.slot = empty >= 0 ? empty : 0;
    const sp = db.species.find(s => s.id === key);
    document.getElementById('lm-title').textContent = `${sp ? sp.name : key} の覚える技`;

}
function closeLearnset() {
    document.getElementById('learnModal').classList.remove('open');

}
function renderLearnset() {
    const key = cardKey(LM.idx);
    const set = CHAMP && CHAMP.sets[key];
    if (!set) return;
    const sp = db.species.find(s => s.id === key);
    const myTypes = sp ? sp.data.Types.filter(t => t).map(t => t.toUpperCase()) : [];
    const q = toKatakana(document.getElementById('lm-search').value.trim().toLowerCase());
    const chosen = new Set(lmMoveInputs().map(el => el.value.trim()).filter(Boolean));

    let list = db.moves.filter(m => set.has(m.id));
    const total = list.length;
    if (LM.cat) list = list.filter(m => m.cat === LM.cat);
    if (LM.type) list = list.filter(m => String(m.type).toUpperCase() === LM.type);
    if (q) list = list.filter(m => toKatakana(m.name.toLowerCase()).includes(q));
    const tIdx = t => { const n = MEMO_TYPES.indexOf(String(t).toUpperCase()); return n < 0 ? 99 : n; };
    const catIdx = c => ({ Physical: 0, Special: 1, Status: 2 }[c] ?? 3);
    if (LM.sort === 'power') list.sort((a, b) => (b.power - a.power) || a.name.localeCompare(b.name, 'ja'));
    else if (LM.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    else list.sort((a, b) => (tIdx(a.type) - tIdx(b.type)) || (catIdx(a.cat) - catIdx(b.cat)) || (b.power - a.power));

    // タイプボタン（このポケモンが覚える技のタイプのみ）
    const typesInSet = new Set(db.moves.filter(m => set.has(m.id)).map(m => String(m.type).toUpperCase()));
    document.getElementById('lm-types').innerHTML =
        `<button type="button" class="all ${LM.type ? '' : 'active'}" data-type="">全タイプ</button>` +
        MEMO_TYPES.filter(t => typesInSet.has(t)).map(t =>
            `<button type="button" class="${LM.type === t ? 'active' : ''}" data-type="${t}" style="background:${MEMO_TYPE_COLOR[t]}">${MEMO_TYPE_JA[t]}</button>`).join('');

    document.getElementById('lm-target').innerHTML =
        `タップした技を入れる先：` + [0, 1, 2, 3].map(s =>
            `<button type="button" class="learn-btn" data-slot="${s}" style="margin-left:4px;${LM.slot === s ? 'background:var(--def);color:#fff;' : ''}">技${s + 1}</button>`).join('');

    const catLabel = { Physical: ['物理', 'P'], Special: ['特殊', 'S'], Status: ['変化', 'St'] };
    const rows = list.map(m => {
        const t = String(m.type).toUpperCase();
        const [cl, cc] = catLabel[m.cat] || ['-', 'St'];
        const pw = m.cat === 'Status' ? '—' : (m.power > 1 ? m.power : '—');
        const stab = m.cat !== 'Status' && myTypes.includes(t) ? '一致' : '';
        return `<div class="lm-item ${chosen.has(m.name) ? 'chosen' : ''}" data-name="${m.name}">
            <span class="tb" style="background:${MEMO_TYPE_COLOR[t] || '#999'}">${MEMO_TYPE_JA[t] || t}</span>
            <span class="nm">${m.name}</span>
            <span class="cat ${cc}">${cl}</span>
            <span class="pw">${pw}</span>
            <span class="stab">${stab}</span>
        </div>`;
    }).join('');
    document.getElementById('lm-list').innerHTML =
        `<div class="lm-count">${list.length} / ${total} 件（データ: Pokémon Showdown チャンピオンズ ${CHAMP.generated || ''}）</div>` +
        (rows || '<div class="lm-empty">該当する技がありません</div>');
}
function pickLearnsetMove(name) {
    const inputs = lmMoveInputs();
    const input = inputs[LM.slot];
    if (!input) return;
    input.value = name;
    const mv = db.moves.find(m => m.name === name);
    if (mv) input.dataset.selectedId = mv.id;
    updateMoveColor(input, mv ? mv.type : '');
    // 次の空き枠へ
    const nextEmpty = inputs.findIndex(el => !el.value.trim());
    if (nextEmpty >= 0) LM.slot = nextEmpty;
    renderLearnset();
}
document.getElementById('lm-search').addEventListener('input', renderLearnset);
document.getElementById('lm-cat').addEventListener('click', e => {
    const b = e.target.closest('button[data-cat]'); if (!b) return;

document.getElementById('lm-sort').addEventListener('click', e => {

document.getElementById('lm-types').addEventListener('click', e => {

(function buildTabs() {

/* ---------- 既存処理のあとで表示を更新 ---------- */
(function hook() {
    const after = (name, fn) => {
        const orig = window[name];
        if (typeof orig !== 'function') return;
        window[name] = function () { const r = orig.apply(this, arguments); try { fn.apply(this, arguments); } catch (e) { console.warn(e); } return r; };
    };
    after('updateSpecies', (idx) => refreshCardMeta(idx));
    after('loadParty', () => refreshAllCards());
    after('importPartyFromCode', () => refreshAllCards());
    after('createPartyUI', () => { refreshAllCards(); restoreDraft(); });
    // 値を書き換える処理のあとは編集中データを自動保存
    ['calcStats', 'updateMoveColor', 'refreshCardMeta', 'loadParty', 'importPartyFromCode', 'clearCard', 'syncNatureButton']
        .forEach(n => after(n, () => saveDraft()));
})();

/* ---------- 編集中の内容を自動保存（ページを移動しても消えない） ---------- */
const DRAFT_KEY = 'party_memo_draft_v1';
let draftReady = false;   // 復元が終わるまでは保存しない（空の状態で上書きしないため）
let draftTimer = null;

function collectPartyData() {
    const data = {
        name: document.getElementById('partyName').value,
        partyMemo: document.getElementById('partyMemo').value,
        slot: document.getElementById('saveSlot').value,
        champOnly: document.getElementById('champOnly').checked,
        learnOnly: document.getElementById('learnOnly').checked,
        members: []
    };
    for (let i = 0; i < 6; i++) {
        const c = document.getElementById(`pokemon-${i}`);
        if (!c) return null;
        data.members.push({
            spName: c.querySelector('.sp-input').value,
            spId: c.querySelector('.sp-input').dataset.selectedId,
            itName: c.querySelector('.item-input').value,
            itId: c.querySelector('.item-input').dataset.selectedId,
            ab: c.querySelector('.ability-select').value,
            nt: c.querySelector('.nature-select').value,
            ev: [...c.querySelectorAll('.ev-input')].map(el => el.value),
            mv: [...c.querySelectorAll('.move-input')].map(el => ({ name: el.value, id: el.dataset.selectedId })),
            memo: c.querySelector('.memo-area').value
        });
    }
    return data;
}
function writeDraftNow() {
    if (!draftReady) return;
    clearTimeout(draftTimer);
    const d = collectPartyData();
    if (!d) return;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (e) { console.warn('下書き保存失敗', e); }
}
function saveDraft() {
    if (!draftReady) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(writeDraftNow, 300);
}
function applyPartyData(data) {
    document.getElementById('partyName').value = data.name || '';
    document.getElementById('partyMemo').value = data.partyMemo || '';
    if (data.slot) document.getElementById('saveSlot').value = data.slot;
    if (typeof data.champOnly === 'boolean') document.getElementById('champOnly').checked = data.champOnly;
    if (typeof data.learnOnly === 'boolean') document.getElementById('learnOnly').checked = data.learnOnly;
    (data.members || []).forEach((m, i) => {
        const c = document.getElementById(`pokemon-${i}`);
        if (!c || !m) return;
        const spInp = c.querySelector('.sp-input');
        spInp.value = m.spName || '';
        if (m.spId) spInp.dataset.selectedId = m.spId; else delete spInp.dataset.selectedId;
        const speciesObj = m.spId && db.species.find(s => s.id === m.spId);
        if (speciesObj) updateSpecies(i, speciesObj.data);
        const itInp = c.querySelector('.item-input');
        itInp.value = m.itName || '';
        if (m.itId) itInp.dataset.selectedId = m.itId; else delete itInp.dataset.selectedId;
        c.querySelector('.nature-select').value = m.nt || 'まじめ';
        c.querySelectorAll('.ev-input').forEach((el, j) => { el.value = (m.ev && m.ev[j]) || 0; });
        validateEV(c.querySelector('.ev-input'), i);
        if (m.ab) c.querySelector('.ability-select').value = m.ab;
        c.querySelectorAll('.move-input').forEach((el, j) => {
            const mv = (m.mv && m.mv[j]) || {};
            el.value = mv.name || '';
            if (mv.id) el.dataset.selectedId = mv.id; else delete el.dataset.selectedId;
            const found = db.moves.find(x => x.name === el.value);
            updateMoveColor(el, found ? found.type : '');
        });
        c.querySelector('.memo-area').value = m.memo || '';
    });
    refreshAllCards();
}
function restoreDraft() {
    // URLで共有された構築を開いた時はそちらを優先
    if (new URLSearchParams(location.search).get('party')) { draftReady = true; return; }
    try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (raw) applyPartyData(JSON.parse(raw));
    } catch (e) { console.warn('下書きの復元に失敗', e); }
    draftReady = true;
}
// 手入力・選択の変更も保存。ページを離れる瞬間は即保存
document.addEventListener('input', saveDraft, true);
document.addEventListener('change', saveDraft, true);
window.addEventListener('pagehide', writeDraftNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') writeDraftNow(); });
</script>
</body>
</html>
